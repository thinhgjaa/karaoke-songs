<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE" />
      <stop offset="100%" stop-color="#F857A6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <g transform="translate(128, 108)" filter="url(#shadow)">
    <!-- Microphone Head -->
    <rect x="76" y="24" width="104" height="168" rx="52" fill="#FFFFFF" />
    <!-- Microphone Grille Line Details -->
    <path d="M76 80 h104 M76 120 h104 M76 160 h104" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
    <!-- Microphone Stand U-Shape -->
    <path d="M48 116 v28 c0 44.18 35.82 80 80 80 s80 -35.82 80 -80 v-28" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Stand Base Pole -->
    <path d="M128 224 v68" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
    <!-- Stand Base Base Plate -->
    <path d="M84 292 h88" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>

